name: Cafeverse TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cafeverse-testflight
  cancel-in-progress: false
jobs:
  ios-release:
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 45
    env:
      CAFE_GAME_SERVER_URL: ${{ vars.CAFE_GAME_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - name: Require deployed secure backend
        run: npm run preflight
      - name: Install signing assets
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" && test -n "$PROFILE_BASE64" && test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$RUNNER_TEMP/build.keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive and export
        run: |
          set -euo pipefail
          xcodebuild -project iOS/Cafeverse.xcodeproj -scheme Cafeverse -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Cafeverse.xcarchive" CAFE_GAME_SERVER_URL="$CAFE_GAME_SERVER_URL" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cafeverse.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist .github/ExportOptions.plist
      - name: Upload TestFlight
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_ID" && test -n "$API_ISSUER_ID" && test -n "$API_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Cafeverse.ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
