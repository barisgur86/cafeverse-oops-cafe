name: Cafeverse TestFlight

on:
  workflow_dispatch:

jobs:
  ios-release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and test game
        run: npm test

      - name: Install signing assets
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p runner "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p runner "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$RUNNER_TEMP/build.keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive iOS
        run: |
          xcodebuild -project iOS/Cafeverse.xcodeproj -scheme Cafeverse -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Cafeverse.xcarchive" archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cafeverse.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist .github/ExportOptions.plist

      - name: Upload TestFlight
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Cafeverse.ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
